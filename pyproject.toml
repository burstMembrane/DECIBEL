[project]
name = "decibel"
version = "1.0.0"
description = "DECIBEL: a system for improvement of automatic chord estimation by using tab and MIDI files"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Daphne Odekerken", email = "D.Odekerken@UU.nl" }]
requires-python = ">=3.10"
keywords = ["audio", "music", "mir", "midi", "tab", "data fusion", "ace", "chord estimation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "audioread>=2.1.8",
    "librosa>=0.10.0",
    "matplotlib>=3.5.0",
    "mido>=1.2.9",
    "mir-eval>=0.7",
    "numba>=0.56.0",
    "numpy>=1.23.0",
    "pandas>=1.5.0",
    "pretty-midi>=0.2.10",
    "pyfluidsynth>=1.3.0",
    "requests>=2.28.0",
    "resampy>=0.4.0",
    "scikit-learn>=1.1.0",
    "scikit-posthocs>=0.7.0",
    "scipy>=1.9.0",
    "seaborn>=0.12.0",
    "selenium>=4.0.0",
    "statsmodels>=0.13.0",
]

[project.urls]
Homepage = "https://github.com/DaphneO/DECIBEL"
Documentation = "https://daphneo.github.io/DECIBEL"
Repository = "https://github.com/DaphneO/DECIBEL"

[project.optional-dependencies]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=2.0.0",
    "sphinxcontrib-applehelp>=1.0.0",
    "sphinxcontrib-devhelp>=1.0.0",
    "sphinxcontrib-htmlhelp>=2.0.0",
    "sphinxcontrib-jsmath>=1.0.0",
    "sphinxcontrib-qthelp>=1.0.0",
    "sphinxcontrib-serializinghtml>=1.1.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["decibel"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
